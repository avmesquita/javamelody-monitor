server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip para assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Cache longo para assets com hash no nome (Angular output hashing)
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca cacheado — garante que o app sempre carrega a versão atual
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Redireciona todas as rotas para index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
